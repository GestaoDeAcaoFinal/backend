name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes, cobertura e pacote
        run: mvn --batch-mode --no-transfer-progress -Dspring.test.context.cache.maxSize=2 verify
      - name: Construir imagem de produção
        run: docker build --tag gestao-backend:ci .
      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
