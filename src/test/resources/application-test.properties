# Banco H2 para testes
spring.datasource.url=jdbc:h2:mem:gestaodeacao_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=validate

# JWT exclusivo para testes
app.jwt.secret=chave-jwt-exclusiva-para-testes-1234567890
app.jwt.expiration=60m
app.jwt.issuer=gestaodeacao-test

# Integracao externa
TWELVE_DATA_API_KEY=test-key