spring.application.name=GestaoDeAcao
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=h2
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

twelvedata.api.key=${TWELVE_DATA_API_KEY}
integracoes.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}
integracoes.brapi.token=${BRAPI_TOKEN}
integracoes.brasilapi.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
integracoes.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
integracoes.twelvedata.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
integracoes.twelvedata.creditos-por-janela=${TWELVE_DATA_CREDIT_LIMIT:8}
integracoes.twelvedata.janela-ms=${TWELVE_DATA_WINDOW_MS:60000}
integracoes.twelvedata.margem-ms=${TWELVE_DATA_MARGIN_MS:100}
integracoes.twelvedata.espera-maxima-ms=${TWELVE_DATA_MAX_WAIT_MS:15000}
integracoes.twelvedata.cambio-cache-segundos=${TWELVE_DATA_FX_CACHE_SECONDS:300}
integracoes.cvm.base-url=${CVM_BASE_URL:https://dados.cvm.gov.br}
integracoes.cvm.cadastro-path=${CVM_CADASTRO_PATH:/dados/INTERMED/CAD/DADOS/cad_intermed.zip}
integracoes.cvm.cache-ttl=${CVM_CACHE_TTL:24h}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# Erros JDBC podem incluir CPF/telefone nos detalhes do banco. O servico registra diagnostico seguro.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
